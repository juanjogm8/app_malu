# Configuración del entorno local de Supabase (`supabase start`).
# La configuración de producción se hace en el panel de Supabase (ver docs/PASOS-DEL-USUARIO.md).
project_id = "casa-en-orden"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Las altas solo ocurren por Google y el trigger handle_new_user rechaza correos no autorizados.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Edge Functions: Telegram no manda JWT y pg_cron usa un secreto propio, así que cada función
# valida su propio encabezado secreto en lugar del JWT de Supabase.
[functions.telegram-webhook]
verify_jwt = false

[functions.digest]
verify_jwt = false

[functions.gcal-auth]
verify_jwt = false

[functions.gcal-sync]
verify_jwt = false
